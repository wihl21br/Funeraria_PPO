<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Clientes - Gestão Funerária</title>

    <link rel="stylesheet" href="main.css" />
  </head>

  <body>
    <header>
      <h1>Sistema de Gestão Funerária</h1>
      <p>Organização de clientes, falecidos e atendimentos</p>
    </header>

    <nav>
      <a href="index.html">Voltar para o Início</a>
      <a href="falecidos.html">Cadastrar Falecido</a>
      <a href="atendimentos.html">Cadastrar Atendimento</a>
    </nav>

    <main>
      <h2>Clientes</h2>
      <form id="formCliente">
        <label>Nome</label>

        <input type="text" id="nomeCliente" required />


        <label>Telefone</label>

        <input type="text" id="telefoneCliente" required />


        <label>E-mail</label>

        <input type="email" id="emailCliente" />


        <button type="submit">Cadastrar Cliente</button>
      </form>




      <h3>Clientes cadastrados</h3>
      <input type="text" id="pesquisaCliente" placeholder="Pesquisar cliente" />
      <div id="listaClientes"></div>
    </main>

    <script src="main.js"></script>
  </body>
</html>
